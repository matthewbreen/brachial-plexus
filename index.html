<!DOCTYPE html>
<html lang="en">
<head>
<script>window.BP_NOSLIDES=1;document.documentElement.classList.add('noslides');</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brachial Plexus Neurogram Playground</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0c0e; --panel:#121418; --panel2:#181b20; --line:#262a31; --ink:#e6e8eb; --dim:#8b929c; --faint:#5a616b;
  --amber:#f5b83d; --cyan:#4fd1e0; --mag:#e46fd3;
  --sans:'IBM Plex Sans',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans);overflow:hidden}
button,select,input{font:inherit;color:inherit}
header{height:52px;display:flex;white-space:nowrap;align-items:center;gap:18px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{display:flex;flex-direction:column;line-height:1.1}
.brand b{font-weight:600;letter-spacing:.01em}
.brand span{font:11px var(--mono);color:var(--dim);letter-spacing:.06em;text-transform:uppercase}
.tabs{display:flex;gap:2px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:3px}
.tabs button{background:none;border:0;padding:5px 12px;border-radius:6px;color:var(--dim);cursor:pointer}
.tabs button.on{background:var(--panel2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
select{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
.sp{flex:1}
.status{font:12px var(--mono);color:var(--dim)}
main{position:absolute;top:52px;bottom:112px;left:0;right:0;display:grid;grid-template-columns:var(--wL,340px) minmax(0,1fr) var(--wR,31vw);gap:1px;background:var(--line)}
.split{position:absolute;top:0;bottom:0;width:9px;margin-left:-4px;cursor:col-resize;z-index:20}
.split:hover,.split.on{background:linear-gradient(90deg,transparent 3px,var(--acc,#f5b83d) 3px,var(--acc,#f5b83d) 6px,transparent 6px);opacity:.7}
.side{background:var(--line);display:grid;grid-template-rows:minmax(0,auto) minmax(200px,1fr);gap:1px;min-height:0;overflow:hidden}
.side>.legend,.side>.diag{position:static !important;width:auto !important;left:auto;top:auto;bottom:auto;border:0;border-radius:0;background:var(--panel);backdrop-filter:none;min-height:0}
.pane{position:relative;background:#000;overflow:hidden}
.pane canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.right{display:grid;grid-template-rows:2.8fr 1fr;gap:1px;background:var(--line)}
.small{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line)}
.tag{position:absolute;top:8px;left:10px;font:11px var(--mono);letter-spacing:.08em;text-transform:uppercase;pointer-events:none;z-index:2}
.tag i{font-style:normal;color:var(--dim);margin-left:6px;letter-spacing:0;text-transform:none}
.orient{position:absolute;font:11px var(--mono);color:var(--faint);pointer-events:none;z-index:2}
.tools{position:absolute;right:8px;top:6px;display:flex;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100% - 150px);gap:4px;z-index:3}
.ib{background:rgba(18,20,24,.85);border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:12px;cursor:pointer;color:var(--ink)}
.ib.on{border-color:var(--amber);color:var(--amber)}
.editbar{position:absolute;left:8px;right:8px;bottom:8px;z-index:4;display:none;flex-wrap:wrap;gap:4px 6px;align-items:center;background:rgba(14,15,18,.86);border:1px solid #5a4520;border-radius:8px;padding:5px 7px;font-size:11px;backdrop-filter:blur(6px)}
.editbar .ib{font-size:11px;padding:2px 7px}
.editbar.on{display:flex}
.notebox{position:absolute;z-index:6;display:none}
.notebox input{width:260px;font:12px var(--sans);padding:5px 8px;border-radius:6px;border:1px solid var(--amber);background:rgba(10,11,13,.95);color:var(--ink);outline:none}
.editbar select{padding:3px 6px;font-size:12px;max-width:170px}
.seg2{display:flex;gap:2px}
.esz,.eprot{display:flex;align-items:center;gap:5px;color:var(--dim)} .esz input{width:70px} .esz output{font:11px var(--mono);color:var(--ink)}
.estat{font:11px var(--mono);color:var(--dim);margin-left:auto}
.ehelp{flex-basis:100%;font:11px var(--mono);color:var(--faint)}
#cSag.painting{cursor:none}
.hover{position:absolute;pointer-events:none;background:rgba(10,11,13,.9);border:1px solid var(--line);border-radius:5px;padding:2px 7px;font-size:12px;z-index:5;display:none;white-space:nowrap}
/* legend */
.legend{position:absolute;left:10px;top:34px;bottom:10px;z-index:3;overflow:auto;width:268px !important;background:rgba(14,15,18,.82);border:1px solid var(--line);border-radius:8px;padding:8px 8px 6px;width:208px;backdrop-filter:blur(6px)}
.legend h4{margin:0 0 4px;font:11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-weight:400;display:flex;justify-content:space-between}
.lg{display:flex;align-items:center;gap:8px;padding:2px 4px;border-radius:4px;cursor:pointer;font-size:13px;user-select:none}
.lg:hover{background:var(--panel2)}
.lg .sw{width:11px;height:11px;border-radius:3px;flex:none}
.lg.off{opacity:.35}
.lg.sel{background:#262017;box-shadow:inset 0 0 0 1px #5a4520}
.lg small{margin-left:auto;color:var(--faint);font:10px var(--mono)}
.grp{margin-bottom:2px}
.org{display:flex;align-items:stretch;margin:1px 0}
.orgitems{flex:1;min-width:0}
.brk{width:6px;border:1px solid var(--faint);border-left:0;margin:4px 4px 4px 2px;border-radius:0 3px 3px 0}
.orgl{width:62px;align-self:center;font:10px/1.2 var(--mono);color:var(--dim)}
.gh{display:flex;align-items:center;gap:6px;padding:6px 4px 3px;margin-top:4px;cursor:pointer;font:600 13.5px var(--sans);letter-spacing:.01em;color:var(--ink);border-radius:4px;border-top:1px solid var(--line)}
.grp:first-of-type .gh{border-top:0;margin-top:0}
.gh .gt:hover{color:var(--amber)} .gh.off .gt{color:var(--faint);text-decoration:line-through}
.lg .sw{cursor:pointer;width:12px;height:12px;transition:transform .1s} .lg .sw:hover{transform:scale(1.25)}
.lg.off{opacity:1} .lg.off .nm{color:var(--faint)}
.orgtog{display:flex;align-items:stretch;cursor:pointer;border-radius:4px} .orgtog:hover{background:var(--panel2)} .orgtog:hover .brk{border-color:var(--amber)}
.org.off .orgl{color:var(--faint);text-decoration:line-through}
.lin{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:11px;color:var(--dim)} .lin .ib{white-space:nowrap}
.gh:hover{background:var(--panel2)} .gh small{margin-left:auto;font-size:10px;color:var(--faint)} .car{width:10px;color:var(--faint)}
.lg{padding-left:16px}
.tg{position:relative;flex:none;width:26px;height:15px;border-radius:8px;background:#2a2e35;border:1px solid #3a3f47;cursor:pointer;transition:background .15s}
.tg i{position:absolute;top:1px;left:1px;width:11px;height:11px;border-radius:50%;background:#7d838c;transition:left .15s,background .15s}
.tg.on{background:#5a4520;border-color:var(--amber)} .tg.on i{left:12px;background:var(--amber)}
.tg.part i{left:6.5px}
.gh .tg{margin-left:6px}
.msts{display:flex;gap:14px;flex-wrap:wrap;padding:2px 4px 6px;border-bottom:1px solid var(--line);margin-bottom:2px}
.mst{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:12.5px;color:var(--ink);user-select:none}
.mst:hover{color:var(--amber)}
.lk{cursor:pointer;color:var(--amber);text-transform:none;letter-spacing:0}
.legend .note{font-size:11px;color:var(--dim);margin-top:6px;line-height:1.35}
.ctl3d{position:absolute;right:10px;bottom:10px;z-index:3;display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:92%}
.diag{position:absolute;left:290px;top:34px;bottom:10px;width:230px;z-index:3;background:rgba(14,15,18,.86);border:1px solid var(--line);border-radius:8px;backdrop-filter:blur(6px);display:flex;flex-direction:column;overflow:hidden}
.diag.closed{bottom:auto;height:auto}
.side.dclosed{grid-template-rows:minmax(0,1fr) auto}
.diag.closed svg,.diag.closed .dnote{display:none}
.diag h4{margin:0;padding:8px 10px 4px;font:600 13.5px var(--sans);display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.diag h4 small{font:11px var(--mono);color:var(--dim);font-weight:400}
.diag svg{flex:1;width:100%;min-height:0}
.diag .dnote{font-size:11px;color:var(--dim);padding:0 10px 8px;line-height:1.35}
.diag path.n{fill:none;stroke-linecap:round;stroke-linejoin:round;cursor:pointer;transition:opacity .15s}
.diag path.n:hover{filter:brightness(1.3)}
.diag text{font:15px var(--sans);fill:#cfd4da;pointer-events:none;paint-order:stroke;stroke:#0e0f12;stroke-width:3px}
.diag text.z{font:italic 12.5px var(--sans);fill:#4fa3d9}
.diag text.h{font:600 12px var(--mono);fill:var(--dim);letter-spacing:.04em}
/* bottom rail */
.rail{position:absolute;left:0;right:0;bottom:0;height:112px;background:var(--panel);border-top:1px solid var(--line);display:grid;grid-template-columns:auto 1fr auto;gap:16px;padding:10px 16px;align-items:stretch}
.stations{display:flex;align-items:center;gap:0}
.st{background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;padding:4px 10px;color:var(--dim)}
.st .dot{width:14px;height:14px;border-radius:50%;border:2px solid currentColor;background:var(--bg)}
.st.on{color:var(--amber)} .st.on .dot{background:var(--amber)}
.st span{font-size:12px}
.st-line{width:22px;height:2px;background:var(--line);margin-bottom:18px}
.card{overflow:auto;padding-right:6px}
.card h3{margin:0 0 2px;font-size:15px;font-weight:600}
.card h3 em{font-style:normal;color:var(--dim);font-weight:400;font-size:12px;margin-left:8px;font-family:var(--mono)}
.card p{margin:0;color:#c9cdd3;font-size:13px}
.card ul{margin:2px 0 0;padding-left:18px;color:#c9cdd3;font-size:13px}
.sliders{display:grid;grid-template-columns:auto 150px 44px;gap:3px 8px;align-items:center;font-size:12px;color:var(--dim)}
.sliders output{font:11px var(--mono);color:var(--ink);text-align:right}
input[type=range]{accent-color:var(--amber);height:16px}
/* slides drawer */
.drawer{position:absolute;inset:0;z-index:6;background:var(--bg);display:none;grid-template-rows:minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr)}
.drawer.open{display:grid}
.drawer .stage{position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.drawer .stage img{max-width:100%;max-height:100%;object-fit:contain}
.drawer .bar{display:flex;align-items:center;gap:8px;padding:8px;border-top:1px solid var(--line);background:var(--panel)}
.thumbs{min-width:0;display:flex;gap:4px;overflow-x:auto;flex:1;padding-bottom:2px}
.thumbs img{height:40px;border-radius:3px;opacity:.5;cursor:pointer;border:1px solid transparent}
.thumbs img.on{opacity:1;border-color:var(--amber)}
.linkbtn{background:var(--amber);color:#1a1205;border:0;border-radius:6px;padding:5px 10px;cursor:pointer;font-weight:500;white-space:nowrap}
.linkbtn:disabled{opacity:.25;cursor:default}
/* quiz */
.quiz .opts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.quiz .opts button{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer}
.quiz .opts button.right{border-color:#4cd97b;color:#4cd97b}
.quiz .opts button.wrong{border-color:#ff6b6b;color:#ff6b6b}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:12px var(--mono);color:var(--dim);z-index:4;background:#000}
.help{position:absolute;right:10px;top:26px;font:11px var(--mono);color:var(--faint);z-index:3;text-align:right;pointer-events:none}
@media (max-width:900px){
  main{grid-template-columns:1fr;grid-template-rows:auto 1fr 1fr;bottom:150px;overflow:auto}
  .side{max-height:260px}
  .rail{height:150px;grid-template-columns:1fr;overflow:auto}
  .legend{width:170px;font-size:12px}
}
.helpb{color:#0b0c0e !important;background:var(--amber,#f5b83d) !important;border-color:transparent !important;font-weight:700}
.helpb.on{box-shadow:0 0 0 2px #fff inset}
.helpP{position:fixed;left:5vw;right:5vw;top:5vh;bottom:5vh;z-index:60;box-shadow:0 20px 80px rgba(0,0,0,.7);background:rgba(10,11,13,.96);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;overflow:hidden}
.helpP .hh{display:flex;align-items:center;gap:6px;padding:6px 8px;font-size:13px}
.helpP .hh b{flex:1}.helpP .hh span{color:var(--dim);font:11px var(--mono)}
.helpP .hstage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#000;container-type:size}
.drawer .stage{container-type:size}
.aslide{position:relative;width:min(100cqw,calc(100cqh*16/9));aspect-ratio:16/9;overflow:hidden;background:#000;cursor:pointer;flex:none}
.aslide>img.base{position:absolute;inset:0;width:100%;height:100%;display:block}
.aslide>.ly{position:absolute;background-repeat:no-repeat}
.helpP .aslide .stepn{display:none}
.aslide .stepn{position:absolute;right:6px;bottom:4px;font:10px var(--mono);color:#8a8f96;background:rgba(0,0,0,.5);padding:1px 5px;border-radius:3px;pointer-events:none}
.helpP .hthumbs{display:flex;gap:4px;padding:6px;overflow-x:auto}
.helpP .hthumbs img{height:64px;border:2px solid transparent;border-radius:3px;cursor:pointer;opacity:.7}
.helpP .hthumbs img.on{border-color:var(--amber,#f5b83d);opacity:1}
.zc3d{position:absolute;top:8px;right:10px;display:flex;gap:4px;z-index:5}
.zc3d .ib{min-width:30px}
.right .help{display:none}
.pane.big-swap{outline:1px solid var(--amber);outline-offset:-1px}
.roilist{position:absolute;left:8px;top:38px;z-index:6;display:none;max-height:calc(100% - 130px);overflow:auto;background:rgba(10,11,13,.92);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:11px var(--sans);min-width:170px}
.roilist h5{margin:4px 0 2px;font:600 10px var(--mono);color:var(--dim);letter-spacing:.06em;text-transform:uppercase}
.roilist.all .grp{display:grid;grid-template-columns:1fr 1fr;column-gap:8px}
.roilist .ri{display:flex;align-items:center;gap:6px;padding:1px 3px;border-radius:4px;cursor:pointer}
.roilist .ri.cur{background:rgba(245,184,61,.18)}
.roilist .ri i{width:9px;height:9px;border-radius:2px;flex:none}
.roilist .ri b{font-weight:400;flex:1}
.roilist .ri span{font:10px var(--mono);color:var(--dim)}
.roilist{position:absolute!important;inset:0!important;width:auto!important;max-height:none!important;border-radius:0!important;border:0!important;padding:10px 12px!important;background:var(--bg,#0b0c0e)!important;z-index:20!important;font-size:12px!important}
.roilist .rb{font-size:12px!important;padding:4px 8px!important}
.roilist h5{margin-top:10px!important}
.roilist .ract{border:1px solid;border-radius:6px;padding:6px 8px 6px 12px;margin-bottom:6px;display:flex;flex-direction:column;gap:1px}
.roilist .ract small{font:600 9px var(--mono);letter-spacing:.08em;color:var(--dim)}
.roilist .ract b{font:600 16px var(--sans)}
.roilist .ract span{font-size:10.5px;color:var(--ink2,#bbb);line-height:1.3}
.roilist .rbtns{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:2px}
.roilist .rb{display:flex;align-items:center;gap:4px;border:1px solid var(--line);background:#16181c;color:var(--ink,#ddd);border-radius:5px;padding:3px 6px;font:11px var(--sans);cursor:pointer}
.roilist .rb i{width:8px;height:8px;border-radius:2px;background:var(--c)}
.roilist .rb span{font:600 10px var(--mono);color:var(--c)}
.roilist .rb.ok{border-color:#3a3f47}
.roilist .rb.cur{border-color:var(--c);background:color-mix(in srgb,var(--c) 22%,#16181c);box-shadow:0 0 0 1px var(--c)}
.roilist .rtr{display:flex;gap:4px;margin-top:8px}
.roilist .rstat{font:10px var(--mono);color:var(--dim);margin-top:4px;min-height:12px}
.roilist .ri.ok span{color:#7ee08a}
.brand,.tabs,.tabs button,#caseSel{flex:none} #status{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:0 1 auto}

/* ---------------- phone layout: one full-screen view at a time, picked from the bottom bar ---------------- */
#mobNav{display:none}
html.mob #tabs [data-m=slides],html.mob #bHelp,html.mob #helpP,html.noslides #tabs [data-m=slides],html.noslides #bHelp,html.noslides #helpP{display:none!important}
html.mob body{overscroll-behavior:none}
html.mob header{height:88px;gap:6px;padding:6px 8px;flex-wrap:wrap;align-content:center}
html.mob .brand,html.mob .status,html.mob .dsk{display:none}
html.mob .tabs{padding:2px;flex:1 1 100%} html.mob .tabs button{flex:1;padding:5px 6px;font-size:13.5px}
html.mob #caseSel{flex:1 1 100%;min-width:0;width:100%;font-size:14px;padding:5px 6px}
html.mob .sp{display:none}
html.mob main{top:88px;bottom:var(--mobB,150px);display:block;grid-template-columns:none!important}
html.mob .split{display:none}
html.mob .right,html.mob .small{display:contents}
html.mob main>.side,html.mob .pane{position:absolute!important;inset:0}
html.mob [data-mvp]:not(.mvOn){display:none!important}
html.mob .side{display:block;overflow:auto;max-height:none;-webkit-overflow-scrolling:touch}
html.mob .side>.legend{overflow:visible;font-size:14px}
html.mob .side>.diag{height:min(70vh,520px);border-top:1px solid var(--line)}
html.mob .lg{padding:5px 6px;font-size:14px} html.mob .lg .sw{width:15px;height:15px}
html.mob .gh{padding:9px 4px 6px;font-size:15px}
html.mob .tg{width:34px;height:20px;border-radius:10px} html.mob .tg i{width:16px;height:16px} html.mob .tg.on i{left:15px} html.mob .tg.part i{left:8px}
html.mob .mst{font-size:14px;gap:8px}
html.mob .pane canvas{touch-action:none}
html.mob .help{display:none}
html.mob .ctl3d{left:6px;right:6px;bottom:6px;max-width:none;justify-content:flex-start;gap:4px}
html.mob .ctl3d .ib,html.mob .tools .ib,html.mob .zc3d .ib{font-size:12.5px;padding:5px 9px}
html.mob .tools{max-width:calc(100% - 110px)}
html.mob .orient{font-size:12px}
html.mob .rail{bottom:calc(54px + env(safe-area-inset-bottom));height:auto;max-height:70vh;overflow:auto;display:flex;flex-direction:column;gap:6px;padding:6px 10px 8px;z-index:30;box-shadow:0 -8px 24px rgba(0,0,0,.4)}
html.mob .stations{overflow-x:auto;justify-content:space-between}
html.mob .st{padding:2px 4px;font-size:12px;gap:3px} html.mob .st-line{flex:1;min-width:6px}
html.mob .card{display:none;order:3}
html.mob .rail.open .card{display:block}
html.mob .sliders{grid-template-columns:auto 1fr 44px;gap:6px 10px;order:2;font-size:13px}
html.mob .rail:not(.open) .sliders>:nth-child(n+4){display:none}
html.mob .sliders input[type=range]{height:26px}
html.mob #mobNav{display:flex;position:absolute;left:0;right:0;bottom:0;height:calc(54px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--panel);border-top:1px solid var(--line);z-index:40}
#mobNav button{flex:1;background:none;border:0;color:var(--dim);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:17px;line-height:1;cursor:pointer}
#mobNav button span{font:11px var(--sans)}
#mobNav button.on{color:var(--amber)}
#mobNav button[data-mv=pSag].on{color:var(--amber)} #mobNav button[data-mv=pCor].on{color:var(--cyan)} #mobNav button[data-mv=pAx].on{color:var(--mag)}
html.mob .drawer .bar{flex-wrap:wrap} html.mob .thumbs img{height:34px}
html.mob .helpP{left:0;right:0;top:0;bottom:0;border-radius:0}
html.mob .editbar{max-height:45%;overflow:auto}
html.mob #eRoi,html.mob .roilist{display:none!important}
</style>
</head>
<body>
<header>
  <div class="brand"><b>Brachial Plexus Neurogram</b><span>Sagittal anatomy playground</span></div>
  <div class="tabs" id="tabs">
    <button data-m="explore" class="on">Explore</button>
    <button data-m="walk"><span class="dsk">Sagittal </span>walk</button>
    <button data-m="slides">Slides</button>
    <button data-m="quiz">Quiz</button>
  </div>

<script>
(()=>{ const m=document.querySelector('main'), L=document.getElementById('spL'), R=document.getElementById('spR');
  let wL=340, wR=Math.round(innerWidth*.31);
  try{ const v=JSON.parse(localStorage.getItem('bpCols')||'null'); if(v){wL=v[0];wR=v[1];} }catch(e){}
  function apply(){ const W=m.clientWidth; wL=Math.max(240,Math.min(wL,W*.45)); wR=Math.max(260,Math.min(wR,W-wL-300));
    m.style.setProperty('--wL',wL+'px'); m.style.setProperty('--wR',wR+'px'); L.style.left=wL+'px'; R.style.left=(W-wR)+'px'; }
  function drag(el,f){ el.addEventListener('pointerdown',e=>{ e.preventDefault(); el.setPointerCapture(e.pointerId); el.classList.add('on');
    const mv=ev=>{ f(ev.clientX); apply(); }, up=()=>{ el.classList.remove('on'); el.removeEventListener('pointermove',mv); el.removeEventListener('pointerup',up);
      try{ localStorage.setItem('bpCols',JSON.stringify([wL,wR])); }catch(e){} };
    el.addEventListener('pointermove',mv); el.addEventListener('pointerup',up); }); }
  drag(L,x=>wL=x); drag(R,x=>wR=m.clientWidth-x);
  L.ondblclick=R.ondblclick=()=>{ wL=340; wR=Math.round(innerWidth*.31); apply(); try{localStorage.removeItem('bpCols')}catch(e){} };
  addEventListener('resize',apply); apply(); })();
</script>

<script>
'use strict';
// ---------------------------------------------------------------- constants
let LABELS = {};
const STATIONS = [
  {k:'roots', t:'Roots', zone:'Supraclavicular',
   body:`<p>Start medially and scroll lateral until five round dots line up from top to bottom: <b>C5, C6, C7, C8, T1</b>. One per finger, thumb to pinky.</p>
   <ul><li>Cervical roots exit <b>above</b> their pedicle, so C5 leaves at C4–5 and C8 at C7–T1.</li><li>T1 is the smallest and sits a little more posterior, below the first rib.</li></ul>`},
  {k:'trunks', t:'Trunks', zone:'Supraclavicular',
   body:`<p>The dots merge into three: <b>C5 + C6 → upper</b>, <b>C7 → middle</b> (it simply continues), <b>C8 + T1 → lower</b>.</p>
   <ul><li>The trunks sit in the scalene triangle, between anterior and middle scalene, with the subclavian artery just in front of the lower trunk.</li><li>Look for variants: C5/C6 piercing anterior scalene, or fused trunks.</li></ul>`},
  {k:'divisions', t:'Divisions', zone:'Retroclavicular',
   body:`<p>Each trunk splits into an anterior and a posterior division: six tubes, but still only two "divisions". They stack <b>over the artery in a little triangle</b> behind the clavicle.</p>
   <ul><li>The suprascapular nerve comes off the upper tip of the triangle, heading for the scapular notch. It should be hard to see.</li></ul>`},
  {k:'cords', t:'Cords', zone:'Infraclavicular',
   body:`<p>The posterior divisions join as the <b>posterior cord</b>. The anterior divisions form the <b>lateral cord</b> (upper and middle) and the <b>medial cord</b> (lower only). Cords are named for where they sit around the axillary artery, and together they make a "pawprint".</p>`},
  {k:'branches', t:'Branches', zone:'Infraclavicular',
   body:`<p>Medial and lateral cord contributions wrap the artery to form the <b>median</b> nerve. <b>MCN</b> swings anterior (usually through coracobrachialis) and <b>axillary</b> swings posterior to the quadrangular space.</p>
   <ul><li>Clockwise around the artery: <b>RUM</b>, radial, ulnar, median.</li></ul>`},
];
const SLIDE_LIST = [18].concat(Array.from({length:52},(_,i)=>31+i));
const SLIDE_STATION = {39:'roots',40:'roots',41:'roots',37:'trunks',42:'trunks',43:'trunks',44:'trunks',45:'trunks',
  49:'divisions',50:'divisions',51:'divisions',53:'divisions',58:'divisions',59:'cords',62:'cords',72:'cords',
  60:'cords',61:'cords',63:'branches',64:'branches',66:'branches',69:'branches',73:'branches',74:'branches',78:'branches',18:'roots',33:'roots',34:'roots'};

// ---------------------------------------------------------------- state
const S = {
  cases:[], cur:null, vol:null, lab:null, dims:[1,1,1], c:[0,0,0],
  tilt:0, yaw:0, win:210, lev:110, zoom:{sag:1,cor:1,ax:1}, fill:true, labels:true,
  hidden:new Set(), sel:0, station:null, mode:'explore', mesh:true, mip:true, plane:true,
  quiz:null, slide:0
};
const $ = id=>document.getElementById(id);
const cache = {};

// ---------------------------------------------------------------- loading
async function pngGray(url){
  const r = await fetch(url); if(!r.ok) throw new Error(url+' '+r.status);
  const bmp = await createImageBitmap(await r.blob(), {colorSpaceConversion:'none', premultiplyAlpha:'none'});
  const cv = document.createElement('canvas'); cv.width=bmp.width; cv.height=bmp.height;
  const ctx = cv.getContext('2d',{willReadFrequently:true}); ctx.drawImage(bmp,0,0);
  const d = ctx.getImageData(0,0,bmp.width,bmp.height).data, g=new Uint8Array(bmp.width*bmp.height);
  for(let i=0,j=0;i<g.length;i++,j+=4) g[i]=d[j];
  return {g,W:bmp.width,H:bmp.height};
}
async function loadMosaic(url, dims, cols){
  const {g,W}=await pngGray(url), [X,Y,Z]=dims, out=new Uint8Array(X*Y*Z);
  for(let k=0;k<Z;k++){ const r=(k/cols)|0, c=k%cols;
    for(let y=0;y<Y;y++){ const src=(r*Y+y)*W+c*X; out.set(g.subarray(src,src+X),(k*Y+y)*X); } }
  return out;
}
async function loadBytes(url,len){ const {g}=await pngGray(url); return g.slice(0,len); }
function parseMesh(u8){
  const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength); let o=0;
  const n = dv.getUint32(o,true); o+=4; const parts=[];
  for(let k=0;k<n;k++){
    const id=dv.getUint32(o,true), nv=dv.getUint32(o+4,true), nt=dv.getUint32(o+8,true); o+=12;
    const pos=new Float32Array(u8.buffer.slice(u8.byteOffset+o, u8.byteOffset+o+nv*12)); o+=nv*12;
    const idx=new Uint32Array(u8.buffer.slice(u8.byteOffset+o, u8.byteOffset+o+nt*12)); o+=nt*12;
    parts.push({id,pos,idx});
  }
  return parts;
}
async function loadCase(id, keep){
  const cs = S.cases.find(c=>c.id===id); S.cur=cs; $('load3d').style.display='flex';
  $('status').textContent='loading '+cs.name+'…';
  if(!cache[id]){
    const vol = await loadMosaic(cs.file, cs.dims, cs.cols);
    const lab = cs.labels ? await loadMosaic(cs.labels, cs.dims, cs.cols) : null;
    const mesh = cs.mesh ? parseMesh(await loadBytes(cs.mesh, cs.meshLen)) : null;
    cache[id]={vol,lab,mesh,orig:lab?lab.slice():null};
  }
  $('bSchem').style.display=cs.schematic?'':'none'; if(!cs.schematic) S.schem=false;
  if(S.schem && cs.schematic && !cache[id].schem){
    $('status').textContent='building the ideal schematic…';
    cache[id].schem={lab:await loadMosaic(cs.schematic.labels,cs.dims,cs.cols), mesh:parseMesh(await loadBytes(cs.schematic.mesh,cs.schematic.meshLen)), vol:cs.schematic.vol?await loadMosaic(cs.schematic.vol,cs.dims,cs.cols):null};
  }
  const d = cache[id]; S.vol=(S.schem&&d.schem&&d.schem.vol)?d.schem.vol:d.vol; S.lab=(S.schem&&d.schem)?d.schem.lab:d.lab; S.dims=cs.dims; setLabelset(cs.labelset); S.ann=cs.annHidden?[]:(cs.annotations||[]);   // Matt's original DICOM arrows are kept as anchors but no longer drawn
  const ck=S.schem&&d.schem?'centS':'cent';
  if(!d[ck]){ computeCentroids(); d[ck]=LAB_CENT; } else LAB_CENT=d[ck];
  if(!keep){ S.sel=0; S.hidden.clear(); }
  applyMsk(); R3.setSel(S.sel,S.hidden);
  if(S.smooth && cs.smooth && !d.smooth) d.smooth=parseMesh(await loadBytes(cs.smooth.mesh,cs.smooth.meshLen));
  $('bSmooth').style.display=cs.smooth&&!S.schem?'':'none';
  S.roll=cs.roll||0; $('rRoll').value=S.roll;
  R3.setVolume(S.vol, cs.dims); R3.setMesh(S.schem&&d.schem?d.schem.mesh:(S.smooth&&d.smooth?d.smooth:d.mesh));
  $('rSlice').min=0; $('rSlice').max=cs.dims[0]-1;
  buildLegend(); buildStations();
  if(!keep){ gotoStation(S.station || 'roots', true); R3.view('ant'); } else renderAll();
  $('load3d').style.display='none';
  $('status').textContent = cs.desc + (cs.approx?' · stations approximate':'');
  $('bMsk').style.display=(cs.labelset||[]).some(l=>l.lvl==='msk')?'':'none';
  { const ss=$('serSel'); ss.style.display=cs.series?'':'none';
    if(cs.series){ ss.innerHTML=cs.series.map((q,i)=>`<option value="${i}">${q.n}</option>`).join(''); ss.value=0; } }
  if(S.mode==='quiz') newQuiz();
  ED.caseLoaded();
}

// ---------------------------------------------------------------- geometry helpers
const add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]], sc=(a,s)=>[a[0]*s,a[1]*s,a[2]*s], dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
// voxel axes: x = patient R->L, y = A->P, z = S->I (1 mm)
function planes(){
  const t=Math.max(-10,Math.min(10,S.tilt))*Math.PI/180, w=Math.max(-10,Math.min(10,S.yaw))*Math.PI/180;
  // sagittal basis before rotation: n=x, u=y(A->P, screen right), v=z(S->I, screen down)
  // tilt: rotate about y (A-P) axis; yaw: rotate about z (S-I) axis
  const rotY=p=>[p[0]*Math.cos(t)-p[2]*Math.sin(t), p[1], p[0]*Math.sin(t)+p[2]*Math.cos(t)];
  const rotZ=p=>[p[0]*Math.cos(w)-p[1]*Math.sin(w), p[0]*Math.sin(w)+p[1]*Math.cos(w), p[2]];
  const R=p=>rotZ(rotY(p));
  // roll: turn the sagittal in its own plane so it hangs straight (the coronal acquisitions are planned tilted 8-20° about L-R)
  const r=(S.roll||0)*Math.PI/180, U0=R([0,1,0]), V0=R([0,0,1]);
  const U=[0,1,2].map(k=>U0[k]*Math.cos(r)-V0[k]*Math.sin(r)), V=[0,1,2].map(k=>U0[k]*Math.sin(r)+V0[k]*Math.cos(r));
  return {
    sag:{n:R([1,0,0]),u:U,v:V,col:'#f5b83d'},
    cor:{n:[0,1,0],u:[1,0,0],v:[0,0,1],col:'#4fd1e0'},
    ax:{n:[0,0,1],u:[1,0,0],v:[0,1,0],col:'#e46fd3'},
  };
}
function sampleVol(x,y,z){
  const [X,Y,Z]=S.dims;
  if(x<0||y<0||z<0||x>X-1.001||y>Y-1.001||z>Z-1.001) return -1;
  const x0=x|0,y0=y|0,z0=z|0,fx=x-x0,fy=y-y0,fz=z-z0, XY=X*Y, i=z0*XY+y0*X+x0, v=S.vol;
  const a=v[i]+(v[i+1]-v[i])*fx, b=v[i+X]+(v[i+X+1]-v[i+X])*fx;
  const c=v[i+XY]+(v[i+XY+1]-v[i+XY])*fx, d=v[i+XY+X]+(v[i+XY+X+1]-v[i+XY+X])*fx;
  const e=a+(b-a)*fy, f=c+(d-c)*fy; return e+(f-e)*fz;
}
function sampleLab(x,y,z){
  if(!S.lab) return 0; const [X,Y,Z]=S.dims;
  const xi=Math.round(x),yi=Math.round(y),zi=Math.round(z);
  if(xi<0||yi<0||zi<0||xi>=X||yi>=Y||zi>=Z) return 0;
  return S.lab[zi*X*Y+yi*X+xi];
}
const hexRGB=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
let LRGB={}, LAB_CENT={};
// lineage: selected structure fully opaque, its parent a bit less, grandparent less, ... everything else faint
function lineageAlpha(){
  if(!S.lineage || !S.sel || !LABELS[S.sel]) return null;
  const w={}; let gen=[S.sel], d=0; w[S.sel]=1;
  while(gen.length && d<8){ d++; const nxt=[];
    for(const id of gen) for(const p of (LABELS[id].par||[])) if(w[p]===undefined && LABELS[p]){ w[p]=Math.max(.2,1-.22*d); nxt.push(p); }
    gen=nxt; }
  return w;
}
function setLabelset(list){ LABELS={}; LRGB={}; for(const l of (list||[])){ LABELS[l.id]=l; LRGB[l.id]=hexRGB(l.c); } }
function computeCentroids(){
  LAB_CENT={}; if(!S.lab) return; const [X,Y,Z]=S.dims, acc={}, bil=S.cur&&S.cur.bilateral, cn=S.cur?S.cur.canal:0;
  for(let z=0,i=0;z<Z;z++) for(let y=0;y<Y;y++) for(let x=0;x<X;x++,i++){ const L0=S.lab[i]; if(L0){ const L=bil&&x>cn?'L'+L0:L0; const a=acc[L]||(acc[L]=[0,0,0,0,[]]); a[0]+=x;a[1]+=y;a[2]+=z;a[3]++; if((a[3]&7)===0) a[4].push([x,y,z]); } }
  for(const L in acc){ const a=acc[L], m=[a[0]/a[3],a[1]/a[3],a[2]/a[3]]; let best=a[4][0]||m, bd=1e9;
    for(const p of a[4]){ const d=(p[0]-m[0])**2+(p[1]-m[1])**2+(p[2]-m[2])**2; if(d<bd){bd=d;best=p;} } LAB_CENT[L]=best; }
}

// ---------------------------------------------------------------- 2D views
const V2 = {};
for(const [key,cid,pid] of [['sag','cSag','pSag'],['cor','cCor','pCor'],['ax','cAx','pAx']]){
  V2[key]={key,cv:$(cid),pane:$(pid),pan:[0,0],img:null,mm:1,W:0,H:0,cents:{}};
}
function resize2D(v){
  const r=v.pane.getBoundingClientRect(), dpr=Math.min(window.devicePixelRatio||1,2);
  v.cv.width=Math.max(2,r.width*dpr|0); v.cv.height=Math.max(2,r.height*dpr|0); v.dpr=dpr;
}
function render2D(key){
  const v=V2[key]; if(!S.vol) return;
  const P=planes()[key], cv=v.cv, ctx=cv.getContext('2d');
  const CW=cv.width, CH=cv.height;
  // sample grid: at most ~560 px on long side
  // hung like PACS: whole volume in view, framing fixed; only the slice position follows the crosshair
  const [VX,VY,VZ]=S.dims, ext=a=>Math.abs(a[0])*VX+Math.abs(a[1])*VY+Math.abs(a[2])*VZ;
  const mmPerCss = Math.max(ext(P.u)/CW, ext(P.v)/CH)*1.02/(S.zoom[key]||1);
  const scale = Math.max(1, Math.ceil(Math.max(CW,CH)/560));
  const W=Math.ceil(CW/scale), H=Math.ceil(CH/scale), mmpx=mmPerCss*scale;
  v.mm=mmPerCss; v.W=CW; v.H=CH;
  const img=new ImageData(W,H), d=img.data, labs=new Uint8Array(W*H);
  const VC=[(VX-1)/2,(VY-1)/2,(VZ-1)/2], off=dot([S.c[0]-VC[0],S.c[1]-VC[1],S.c[2]-VC[2]],P.n);
  const c=add(add(VC,sc(P.n,off)), add(sc(P.u,v.pan[0]), sc(P.v,v.pan[1])));
  const lo=S.lev-S.win/2, k=255/S.win;
  const hl=S.station && S.mode==='walk' ? STATIONS.find(s=>s.k===S.station).k : null;

    $('caseSel').onchange=e=>loadCase(e.target.value);
    buildThumbs(); relayout();
    await loadCase(S.cases[0].id);
  }catch(err){ console.error(err); $('status').textContent='Could not load data: '+err.message; $('load3d').textContent='Could not load data'; }
})();
</script>
</body>
</html>
